<div class="page-container">

  <app-lista></app-lista>

  @if (panelAbierto()) {
    <app-detalle></app-detalle>
  }

</div>

@if (crearCitaAbierto()) {
  <div class="modal-overlay" (click)="cerrar()">
    <div class="cita-modal" (click)="$event.stopPropagation()">
      <div class="cita-modal-header">
        <h5 class="fw-bold mb-0">
          <i class="bi bi-calendar-plus me-2"></i>Nueva cita
        </h5>
        <button class="btn-close" (click)="cerrar()"></button>
      </div>

      <div class="cita-modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label small fw-semibold">Paciente *</label>
            <select class="form-select" [ngModel]="pacienteId()" (ngModelChange)="pacienteId.set($event)">
              <option [value]="null">Seleccionar paciente...</option>
              @for (p of pacientes(); track p.idPaciente) {
                <option [value]="p.idPaciente">{{ p.nombre }} {{ p.apellido }} — {{ p.email }}</option>
              }
            </select>
          </div>

          <div class="col-sm-6">
            <label class="form-label small fw-semibold">Especialidad *</label>
            <select class="form-select" [ngModel]="especialidad()" (ngModelChange)="especialidad.set($event); onEspecialidadChange()">
              <option value="">Seleccionar...</option>
              @for (e of especialidades; track e) {
                <option [value]="e">{{ e }}</option>
              }
            </select>
          </div>

          <div class="col-sm-6">
            <label class="form-label small fw-semibold">Médico *</label>
            @if (loadingDoctores()) {
              <div class="form-control d-flex align-items-center gap-2 text-muted">
                <span class="spinner-border spinner-border-sm"></span> Cargando...
              </div>
            } @else {
              <select class="form-select" [ngModel]="medico()" (ngModelChange)="medico.set($event)" [disabled]="!especialidad() || doctores().length === 0">
                <option value="">Seleccionar...</option>
                @for (d of doctores(); track d.idDoctor) {
                  <option [value]="d.nombre">{{ d.nombre }}</option>
                }
              </select>
            }
          </div>

          <div class="col-sm-6">
            <label class="form-label small fw-semibold">Fecha *</label>
            <input type="date" class="form-control" [ngModel]="fecha()" (ngModelChange)="fecha.set($event)" [min]="today" />
          </div>

          <div class="col-12">
            <label class="form-label small fw-semibold">Horario *</label>
            <div class="d-flex flex-wrap gap-2">
              @for (slot of slots; track slot) {
                <button type="button" class="btn btn-sm slot-btn"
                        [class.btn-primary]="hora() === slot"
                        [class.btn-outline-secondary]="hora() !== slot"
                        (click)="hora.set(slot)">
                  {{ slot }}
                </button>
              }
            </div>
          </div>

          <div class="col-12">
            <label class="form-label small fw-semibold">Motivo</label>
            <input type="text" class="form-control" placeholder="Consulta general" [ngModel]="motivo()" (ngModelChange)="motivo.set($event)" />
          </div>

          @if (error()) {
            <div class="col-12">
              <div class="alert alert-danger py-2 mb-0 small">{{ error() }}</div>
            </div>
          }
        </div>
      </div>

      <div class="cita-modal-footer">
        <button class="btn btn-sm btn-outline-secondary" (click)="cerrar()">Cancelar</button>
        <button class="btn btn-sm btn-primary" (click)="onSubmit()" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ saving() ? 'Guardando...' : 'Crear cita' }}
        </button>
      </div>
    </div>
  </div>
}
