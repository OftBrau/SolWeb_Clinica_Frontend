<div class="page-wrapper content-wrapper">
  <app-page-header title="Evaluaciones" subtitle="Reporte de evaluaciones de practicantes"
    [breadcrumbs]="[{label:'Inicio',link:'/app'},{label:'Evaluaciones'}]"></app-page-header>

  @if (cargando()) { <div class="text-center py-5"><div class="spinner-border"></div></div> }

  <div class="row g-3">
    @for (p of practicantes(); track p.idPracticante) {
      <div class="col-md-6">
        <div class="card card-eval h-100 border shadow-sm">
          <div class="card-body d-flex justify-content-between align-items-center">
            <div class="d-flex gap-2 align-items-center">
              @if (p.fotoUrl) { <img [src]="p.fotoUrl" style="width:40px;height:40px;border-radius:50%;object-fit:cover"> }
              @else { <div style="width:40px;height:40px;border-radius:50%;background:var(--bs-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">{{ p.nombre?.charAt(0) || '?' }}</div> }
              <div>
                <strong>{{ p.nombre }}</strong>
                <br><small class="text-muted">{{ p.email }}</small>
              </div>
            </div>
            <button class="btn btn-sm btn-outline-primary" (click)="descargarPDF(p.idPracticante)">
              <i class="bi bi-download me-1"></i>PDF
            </button>
          </div>
        </div>
      </div>
    }
    @if (practicantes().length === 0 && !cargando()) {
      <p class="text-muted text-center">No hay practicantes registrados.</p>
    }
  </div>
</div>
