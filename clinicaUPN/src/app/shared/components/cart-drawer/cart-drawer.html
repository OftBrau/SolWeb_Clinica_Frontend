<!-- Botón del carrito -->
<button class="cart-trigger" (click)="toggle()" title="Carrito">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
    <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
  </svg>
  @if (count > 0) {
    <span class="cart-badge">{{ count }}</span>
  }
</button>

<!-- Overlay -->
@if (abierto()) {
  <div class="cart-overlay" (click)="abierto.set(false)"></div>
}

<!-- Drawer -->
<div class="cart-drawer" [class.open]="abierto()">
  <div class="cart-header">
    <h5>Carrito</h5>
    <button class="btn-close" (click)="abierto.set(false)"></button>
  </div>
  <div class="cart-body">
    @if (items.length === 0) {
      <div class="cart-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" class="text-muted mb-3">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <p class="text-muted">Tu carrito está vacío</p>
        <a routerLink="/farmacia" class="btn btn-outline-primary btn-sm" (click)="abierto.set(false)">Ver productos</a>
      </div>
    } @else {
      @for (item of items; track item.idMedicamento) {
        <div class="cart-item">
          <div class="cart-item-info">
            <span class="cart-item-name">{{ item.nombreComercial }}</span>
            <span class="cart-item-price">S/ {{ item.precioUnitario }}</span>
          </div>
          <div class="cart-item-actions">
            <button class="btn-qty" (click)="actualizar(item, -1)">-</button>
            <span class="qty-val">{{ item.cantidad }}</span>
            <button class="btn-qty" (click)="actualizar(item, 1)">+</button>
            <button class="btn-remove" (click)="eliminar(item)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
            </button>
          </div>
        </div>
      }
    }
  </div>
  @if (items.length > 0) {
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <strong>S/ {{ total | number:'1.2-2' }}</strong>
      </div>
      <button class="btn btn-primary w-100" (click)="checkout()">Proceder al pago</button>
    </div>
  }
</div>
